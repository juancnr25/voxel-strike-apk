name: Compilar APK Voxel Strike

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Preparar archivos web
        run: |
          mkdir -p www
          cp index.html three.module.min.js icon-512.png www/

      - name: Crear proyecto Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.voxelstrike.app",
            "appName": "Voxel Strike",
            "webDir": "www",
            "android": { "backgroundColor": "#0a0a0c" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Ajustes Android (horizontal, vibración, pantalla completa)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' $M
          cat > android/app/src/main/java/com/voxelstrike/app/MainActivity.java <<'JAVA'
          package com.voxelstrike.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  ocultarBarras();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) ocultarBarras();
              }

              private void ocultarBarras() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          JAVA

      - name: Icono y pantalla de carga
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done
          for f in $(find $R -name splash.png); do
            WH=$(identify -format '%wx%h' $f)
            H=$(identify -format '%h' $f)
            convert -size $WH xc:'#0a0a0c' \( icon-512.png -resize $((H/3))x$((H/3)) \) -gravity center -composite $f
          done

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../VoxelStrike.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelStrike-apk
          path: VoxelStrike.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Voxel Strike v${{ github.run_number }}
          files: VoxelStrike.apk
